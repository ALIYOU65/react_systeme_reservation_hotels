  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hôtel La Lumière - Réservation</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- SOLUTION DÉFINITIVE 2025 – désactive React DevTools AVANT que React ne se charge -->
    <script>
      // On exécute ça IMMÉDIATEMENT, avant tout le reste
      (function () {
        // Crée un objet vide qui remplace le hook React DevTools
        window.__REACT_DEVTOOLS_GLOBAL_HOOK__ = {
          supportsFiber: true,
          inject: function () {},
          onCommitFiberRoot: function () {},
          onCommitFiberUnmount: function () {},
          isDisabled: true
        };
      })();
    </script>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
